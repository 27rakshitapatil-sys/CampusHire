<!DOCTYPE html>

<html>
<head>
    <title>Apply for Job - CampusHire</title>

```
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        margin: 0;
    }

    .container {
        width: 500px;
        margin: 50px auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
        text-align: center;
        color: #2563eb;
        margin-bottom: 30px;
    }

    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 5px;
        font-weight: bold;
    }

    input,
    textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
    }

    textarea {
        height: 100px;
        resize: vertical;
    }

    .error {
        color: red;
        text-align: center;
        font-weight: bold;
        margin-bottom: 15px;
    }

    .submit-btn {
        width: 100%;
        margin-top: 25px;
        padding: 12px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
    }

    .submit-btn:hover {
        background: #1d4ed8;
    }
</style>
```

</head>

<body>

<div class="container">

```
<h1>Apply for Job</h1>

{% if error %}
    <p class="error">
        ⚠️ {{ error }}
    </p>
{% endif %}

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <label>Full Name</label>
    <input type="text" name="name" placeholder="Enter your full name">

    <label>Email</label>
    <input type="email" name="email" placeholder="Enter your email">

    <label>Phone Number</label>
    <input type="tel" name="phone" placeholder="Enter your phone number">

    <label>Resume</label>
    <input type="file" name="resume">

    <label>Cover Letter</label>
    <textarea name="cover_letter" placeholder="Write your cover letter"></textarea>

    <button type="submit" class="submit-btn">
        Submit Application
    </button>

</form>
```

</div>

</body>
</html>
