<!DOCTYPE html>
<html>
<head>

    <title>Notifications - CampusHire</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 30px;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            width: 80%;
            margin: 40px auto;
        }

        h1 {
            color: #1f2937;
        }

        .notification {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .notification p {
            margin: 0 0 8px;
            font-size: 16px;
        }

        .notification small {
            color: #777;
        }

        .empty {
            background: white;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            color: #777;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #1f2937;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

    </style>

</head>

<body>

<div class="navbar">
    CampusHire 🔔
</div>

<div class="container">

    <h1>Notifications</h1>

    {% if notifications %}

        {% for notification in notifications %}

            <div class="notification">

                <p>🔔 {{ notification.message }}</p>

                <small>
                    {{ notification.created_at|date:"d M Y, h:i A" }}
                </small>

            </div>

        {% endfor %}

    {% else %}

        <div class="empty">
            No notifications yet.
        </div>

    {% endif %}

    <a href="/" class="back">
        ← Back to Home
    </a>

</div>

</body>
</html>
