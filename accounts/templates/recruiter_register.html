<!DOCTYPE html>
<html>
<head>
    <title>CampusHire - Recruiter Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding-top: 40px;
            padding-bottom: 40px;
        }

        .register-box {
            width: 400px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: Arial, sans-serif;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 15px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="register-box">

    <h1>CampusHire</h1>

    <h2>Recruiter Registration</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Username</label>
        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >

        <label>Full Name</label>
        <input
            type="text"
            name="full_name"
            placeholder="Enter full name"
            required
        >

        <label>Email</label>
        <input
            type="email"
            name="email"
            placeholder="Enter email"
            required
        >

        <label>Phone</label>
        <input
            type="text"
            name="phone"
            placeholder="Enter phone number"
        >

        <label>Company Name</label>
        <input
            type="text"
            name="company_name"
            placeholder="Enter company name"
        >

        <label>Company Description</label>
        <textarea
            name="company_description"
            placeholder="Describe your company"
        ></textarea>

        <label>Company Website</label>
        <input
            type="url"
            name="company_website"
            placeholder="https://example.com"
        >

        <label>Company Location</label>
        <input
            type="text"
            name="company_location"
            placeholder="Enter company location"
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <label>Confirm Password</label>
        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm password"
            required
        >

        <button type="submit">
            Register as Recruiter
        </button>

    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <div class="login-link">
        Already have an account?
        <a href="/accounts/login/">Login</a>
    </div>

</div>

</body>
</html>
